[package]
name = "alloy-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Register-based bytecode compiler, inline caches, Cranelift JIT engine, and execution virtual machine for the Alloy runtime."

[lints]
workspace = true

[dependencies]
alloy-core = { package = "alloy-runtime-core", path = "../alloy-core", version = "0.2.0" }
hashbrown.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
cranelift-codegen = "0.136.0-rc.1"
cranelift-frontend = "0.136.0-rc.1"
cranelift-jit = "0.136.0-rc.1"
cranelift-module = "0.136.0-rc.1"
cranelift-native = "0.136.0-rc.1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
