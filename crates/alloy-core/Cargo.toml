[package]
name = "alloy-core"
version.workspace = true
edition.workspace = true

[dependencies]
libc.workspace = true
hashbrown.workspace = true

[target.'cfg(windows)'.dependencies]
# File-backed shared segment (CreateFileMappingW/MapViewOfFile) so a child
# Python/C sidecar can map the exact same memory block zero-copy.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading"] }
