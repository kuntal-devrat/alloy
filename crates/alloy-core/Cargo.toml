[package]
name = "alloy-runtime-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Core primitives, NaN-tagged value representation, memory arena allocator, and zero-copy shared memory segment for the Alloy runtime."

[lib]
name = "alloy_core"

[lints]
workspace = true

[dependencies]
libc.workspace = true
hashbrown.workspace = true

[target.'cfg(windows)'.dependencies]
# File-backed shared segment (CreateFileMappingW/MapViewOfFile) so a child
# Python/C sidecar can map the exact same memory block zero-copy.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Threading"] }
